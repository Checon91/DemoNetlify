<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseDesk</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="PulseDesk home">
          <span class="brand-mark">P</span>
          <span>
            <strong>PulseDesk</strong>
            <small>Project control</small>
          </span>
        </a>

        <nav class="nav-list" aria-label="Primary">
          <button class="nav-item is-active" type="button" data-filter="all">All projects</button>
          <button class="nav-item" type="button" data-filter="active">Active</button>
          <button class="nav-item" type="button" data-filter="completed">Completed</button>
        </nav>

        <div class="account-card" id="accountCard" hidden>
          <span id="accountName"></span>
          <button class="text-button" type="button" id="logoutButton">Log out</button>
        </div>
      </aside>

      <main class="main-panel">
        <section class="auth-view" id="authView">
          <div class="auth-copy">
            <p class="eyebrow">Full stack demo</p>
            <h1>Plan projects with a real login and a real API.</h1>
            <p>
              Create an account, add work, track status, and deploy the whole thing to Netlify.
            </p>
          </div>

          <form class="auth-form" id="authForm">
            <div class="form-header">
              <h2 id="authTitle">Create account</h2>
              <button class="text-button" type="button" id="toggleAuth">Sign in instead</button>
            </div>

            <label id="nameField">
              <span>Name</span>
              <input name="name" type="text" autocomplete="name" placeholder="Ada Lovelace" />
            </label>

            <label>
              <span>Email</span>
              <input name="email" type="email" autocomplete="email" placeholder="ada@example.com" required />
            </label>

            <label>
              <span>Password</span>
              <input
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="At least 8 characters"
                required
              />
            </label>

            <p class="form-message" id="authMessage" role="alert"></p>
            <button class="primary-button" type="submit" id="authSubmit">Create account</button>
          </form>
        </section>

        <section class="dashboard-view" id="dashboardView" hidden>
          <header class="topbar">
            <div>
              <p class="eyebrow">Workspace</p>
              <h1>Your projects</h1>
            </div>
            <button class="primary-button" type="button" id="newProjectButton">New project</button>
          </header>

          <section class="stats-grid" aria-label="Project stats">
            <article>
              <span id="totalCount">0</span>
              <p>Total</p>
            </article>
            <article>
              <span id="activeCount">0</span>
              <p>Active</p>
            </article>
            <article>
              <span id="completedCount">0</span>
              <p>Completed</p>
            </article>
          </section>

          <section class="workspace">
            <form class="project-form" id="projectForm">
              <div class="form-header">
                <h2 id="projectFormTitle">Add project</h2>
                <button class="text-button" type="button" id="cancelEditButton" hidden>Cancel</button>
              </div>

              <label>
                <span>Title</span>
                <input name="title" type="text" placeholder="Launch portfolio site" required />
              </label>

              <label>
                <span>Description</span>
                <textarea name="description" rows="4" placeholder="Scope, notes, next steps"></textarea>
              </label>

              <div class="form-row">
                <label>
                  <span>Priority</span>
                  <select name="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                  </select>
                </label>

                <label>
                  <span>Due date</span>
                  <input name="dueDate" type="date" />
                </label>
              </div>

              <label>
                <span>Status</span>
                <select name="status">
                  <option value="active" selected>Active</option>
                  <option value="completed">Completed</option>
                </select>
              </label>

              <p class="form-message" id="projectMessage" role="alert"></p>
              <button class="primary-button" type="submit" id="projectSubmit">Save project</button>
            </form>

            <section class="project-list" id="projectList" aria-live="polite"></section>
          </section>
        </section>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
